services:
  - type: web
    name: besoia-api
    runtime: node
    plan: free # switch to starter for the live test
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: besoia-db
          property: connectionString
      - key: QR_SECRET
        generateValue: true
      - key: EXPORT_TOKEN
        generateValue: true

  - type: web
    name: besoia
    runtime: static
    repo: https://github.com/TharinduSampath2000/besoia_pilot_frontend
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # same-origin API so the session cookie works on iOS Safari
      - type: rewrite
        source: /api/*
        destination: https://besoia-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: besoia-db
    plan: free # expires after 30 days
    region: frankfurt
    databaseName: besoia
    user: besoia
